name: Deploy to Beget

# Собирает фронт (Vite) и заливает на Beget по SSH/rsync.
# assets/ -> зеркало с очисткой; корень -> overlay; api/ и db/ -> отдельно; затем миграции.
# Триггер — push в продакшен-ветку (поменяй на свою, например main).

on:
  push:
    branches: [claude/fitness-tracking-app-zMTWe]
  workflow_dispatch:

concurrency:
  group: deploy-beget
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE: ${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}
      RPATH: ${{ secrets.BEGET_PATH }}
      SSH_OPTS: -i ~/.ssh/id_deploy -p ${{ secrets.BEGET_SSH_PORT || '22' }} -o StrictHostKeyChecking=accept-new
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run check:canon
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.BEGET_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Check SSH connection
        run: ssh $SSH_OPTS "$REMOTE" "echo SSH OK on \$(hostname)"

      - name: Deploy frontend assets (mirror with cleanup)
        run: rsync -az --delete -e "ssh $SSH_OPTS" dist/assets/ "$REMOTE:$RPATH/assets/"

      - name: Deploy frontend root files (overlay, no delete)
        run: rsync -az --exclude 'assets' -e "ssh $SSH_OPTS" dist/ "$REMOTE:$RPATH/"

      - name: Deploy backend (api -> public_html/api)
        run: rsync -az --delete --exclude 'config.local.php' -e "ssh $SSH_OPTS" api/ "$REMOTE:$RPATH/api/"

      - name: Deploy DB migrations (db -> public_html/db)
        run: rsync -az --delete -e "ssh $SSH_OPTS" db/ "$REMOTE:$RPATH/db/"

      - name: Apply DB migrations (idempotent, over SSH)
        run: ssh $SSH_OPTS "$REMOTE" "${{ secrets.BEGET_PHP || 'php' }} $RPATH/api/migrate.php"
